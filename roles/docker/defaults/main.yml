---
# Unofficial packages that conflict with Docker Engine (Docker docs: "Uninstall old versions")
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - docker-buildx
  - podman-docker
  - containerd
  - runc

# Docker Engine, CLI, containerd and plugins from Docker's own repository
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_users: []

# Container Log rotation (daemon.json): each container keeps at most
# max-file log files of max-size each. Docker wants both values as strings
docker_log_max_size: "10m"
docker_log_max_file: "3"

# Shared network for containers that sit behind Nginx Proxy Manager
docker_proxy_network: proxy
docker_proxy_subnet: "172.20.0.0/24"
docker_proxy_gateway: "172.20.0.1"
