---
# Pinned Portainer CE LTS release. Check https://github.com/portainer/portainer/releases before bumping.
portainer_version: "2.45.3"
portainer_image: "portainer/portainer-ce:{{ portainer_version }}"

portainer_container_name: portainer

# Named volume mounted at /data: Portainer's database, settings, and certificate.
portainer_volume_name: portainer_data

portainer_restart_policy: unless-stopped

# Docker network shared with NPM. The docker role creates it,
# so this must match docker_proxy_network.
portainer_network: proxy
