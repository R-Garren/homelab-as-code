---
# Installs Docker Engine from Docker's official apt repository.
# Follows https://docs.docker.com/engine/install/ubuntu/ step by step.

- name: Remove unofficial Docker packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Install packages needed to add Docker's repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Docker's GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Make sure Docker is running and starts at boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install the Docker SDK for Python (needed by community.docker modules)
  ansible.builtin.apt:
    name: python3-docker
    state: present

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Reset the SSH connection so the new group membership applies
  ansible.builtin.meta: reset_connection

- name: Create the Docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure Docker log rotation
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    validate: dockerd --validate --config-file=%s
  notify: Restart Docker

- name: Create the shared proxy network
  community.docker.docker_network:
    name: "{{ docker_proxy_network }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ docker_proxy_subnet }}"
        gateway: "{{ docker_proxy_gateway }}"
    state: present

# Restart Docker now if its config changed. Left to the end of the play, the
# restart would kill containers that later roles start (Week 8 finding).
- name: Apply pending Docker restarts now
  ansible.builtin.meta: flush_handlers
